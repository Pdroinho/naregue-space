name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_BASE_URL: https://naregua.space
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check

  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_APP_BASE_URL: https://naregua.space
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: node scripts/check-landing-ui.mjs --desktop-only
      - run: node scripts/check-mobile-landing.mjs
      - run: node scripts/check-mobile-landing.mjs --firefox

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          scanner_dir="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" -o "$scanner_dir/$archive"
          curl --fail --silent --show-error --location "$base/$checksums" -o "$scanner_dir/$checksums"
          (cd "$scanner_dir" && sha256sum --check --ignore-missing "$checksums")
          tar -xzf "$scanner_dir/$archive" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --redact=100 --log-opts=--all

  release:
    if: github.event_name == 'push'
    needs: [checks, landing, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish versioned release after validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/RELEASE_${GITHUB_REF_NAME#v}.md"
          test -f "$notes"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "NaRégua $GITHUB_REF_NAME" --notes-file "$notes"
